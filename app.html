<div class="app"><aside class="sidebar"><div class="brand"><div class="mark"><span></span></div><div class="brand-text">KT Projects</div></div><div class="nav-label">檢視</div><nav class="nav"><button class="active" data-view="board"><i class="dot"></i><span>任務看板</span></button><button data-view="list"><i class="dot"></i><span>任務清單</span></button><button data-view="tree"><i class="dot"></i><span>角色樹狀圖</span></button></nav><div class="nav-label">我的專案</div><div class="project-list" id="projectList"></div><div class="side-progress"><div class="row"><span>目前專案進度</span><b id="sidePct">0%</b></div><div class="bar"><i id="sideBar"></i></div></div></aside>
<main class="main"><header class="topbar"><div class="project-select"><select id="projectSelect" aria-label="切換專案"></select><button class="btn" id="editProject">編輯專案</button></div><div class="actions"><button class="btn primary" id="newTask">＋ 新增任務</button><div class="avatar">KT</div></div></header><section class="content"><div class="heading"><div><h1 id="projectHeading">專案工作總覽</h1><p id="projectDesc"></p></div><div class="tabs"><button class="active" data-view="board">看板</button><button data-view="list">清單</button><button data-view="tree">樹狀圖</button></div></div><div class="team" id="team"></div><div class="stats"><div class="stat accent"><b id="totalCount">0</b><span>全部任務</span></div><div class="stat"><b id="todoCount">0</b><span>待處理</span></div><div class="stat"><b id="doingCount">0</b><span>進行中</span></div><div class="stat"><b id="doneCount">0</b><span>已完成</span></div></div><div id="board" class="board"></div><div id="list" class="list"></div><div id="tree" class="tree"></div></section></main></div>
<div id="taskModal" class="modal-bg"><form class="modal" id="taskForm"><h2 id="taskModalTitle">新增任務</h2><input type="hidden" id="taskId"><div class="field"><label>任務名稱</label><input id="taskName" required></div><div class="field"><label>負責角色</label><select id="taskRole"></select></div><div class="field"><label>狀態</label><select id="taskStatus"><option value="todo">待處理</option><option value="doing">進行中</option><option value="done">已完成</option></select></div><div class="field"><label>到期日</label><input id="taskDue" type="date"></div><div class="modal-actions"><button type="button" class="btn danger" id="deleteTask" style="margin-right:auto;display:none">刪除</button><button type="button" class="btn" data-close>取消</button><button class="btn primary">儲存任務</button></div></form></div>
<div id="projectModal" class="modal-bg"><form class="modal" id="projectForm"><h2 id="projectModalTitle">新增專案</h2><input type="hidden" id="projectId"><div class="field"><label>專案名稱</label><input id="projectName" required></div><div class="field"><label>專案說明</label><input id="projectDescription"></div><div class="member-fields" id="memberFields"></div><div class="modal-actions"><button type="button" class="btn danger" id="deleteProject" style="margin-right:auto;display:none">刪除專案</button><button type="button" class="btn" data-close>取消</button><button class="btn primary">儲存專案</button></div></form></div><div id="toast" class="toast">已儲存</div>
<script>
const roles={PM:'Project Manager',CE:'Chief Engineer',PE:'Project Engineer',ME:'Manufacturing Engineer',SME:'Sample Manufacturing Engineer',QE:'Quality Engineer'},$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const seed=()=>[['RFQ','PM'],['試樣通知','PM'],['DFM','CE'],['成本分析','CE'],['PFD','CE'],['PFMEA','PE'],['PPAP','PE'],['CP','ME'],['刀模夾治具設計','ME'],['加工程式編輯','ME'],['試樣','SME'],['問題清單回覆','SME'],['SOP 建立','SME'],['SIP / SPC','QE'],['FAI & CPK','QE']].map((x,i)=>({id:crypto.randomUUID(),name:x[0],role:x[1],status:i<3?'doing':i<6?'done':'todo',due:''}));
const members=n=>Object.fromEntries(Object.keys(roles).map(k=>[k,n[k]||'未指派']));const samples=[{id:'npi',name:'NPI 試樣專案',description:'工程開發與試樣流程',members:members({PM:'Eric',CE:'Brian',PE:'Johnny',ME:'Kevin',SME:'Jason',QE:'Anna'}),tasks:seed()},{id:'v3',name:'V3 Backer Plate',description:'PPAP 與量產導入',members:members({PM:'Johnny',CE:'Brian',PE:'Eric',ME:'Mike',SME:'Leo',QE:'Amy'}),tasks:[{id:crypto.randomUUID(),name:'DFM Review',role:'CE',status:'done',due:''},{id:crypto.randomUUID(),name:'PPAP 文件',role:'PE',status:'doing',due:''},{id:crypto.randomUUID(),name:'CNC 程式確認',role:'ME',status:'todo',due:''}]},{id:'cp-arm',name:'CP Arm Qualification',description:'製程驗證與試產',members:members({PM:'Eric',CE:'Jonny',PE:'Johnny',ME:'David',SME:'Sam',QE:'Cindy'}),tasks:[{id:crypto.randomUUID(),name:'試樣排程',role:'PM',status:'doing',due:''},{id:crypto.randomUUID(),name:'FAI & CPK',role:'QE',status:'todo',due:''}]}];
let projects=load(),activeId=localStorage.getItem('ktActiveProject')||projects[0].id,activeView='board';function load(){const v=localStorage.getItem('ktProjectsV2');if(v)return JSON.parse(v);const old=localStorage.getItem('ktProjectTasks');if(old)samples[0].tasks=JSON.parse(old);return samples}function current(){return projects.find(p=>p.id===activeId)||projects[0]}function persist(msg='已儲存變更'){localStorage.setItem('ktProjectsV2',JSON.stringify(projects));localStorage.setItem('ktActiveProject',activeId);render();toast(msg)}

function bindAccountModalEvents(){
  const state=accountState();
  $('#accountRows').onclick=(event)=>{

    state.selectedEmail=button.dataset.accountEmail;

    fillAccountForm(state.users.find((user)=>user.email===state.selectedEmail));

  };

    const accessRole=$('#accountRoleInput').value;

      toast('請填寫姓名與 Email');

    if(state.selectedEmail){

      if(password)payload.password=password;

      toast('帳號已更新');

    }
    const sessionData=await sessionResponse.json();
    if(!sessionResponse.ok)throw new Error(sessionData.error||'帳號沒有使用權限');
    sharedSession=sessionData.user;
    $('#syncName').textContent=sharedSession.displayName;
    $('.avatar').textContent=initials(sharedSession.displayName);
    setAuthLabel();
    const remote=await fetchShared();
    if(remote.empty){
      if(sharedSession.accessRole!=='admin')throw new Error('請由管理者先建立共用資料');
      const response=await fetch('/api/state',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(sharedPayload())});
      if(!response.ok)throw new Error((await response.json()).error||'無法建立共用資料');
    }else{
      projects=remote.state.projects;
      activeId=projects.some(p=>p.id===remote.state.activeProjectId)?remote.state.activeProjectId:projects[0].id;
      localStorage.setItem('ktProjectsV2',JSON.stringify(projects));
      localStorage.setItem('ktActiveProject',activeId);
    }
    sharedLoading=false;setSync('ready','已同步');render();
  }catch(error){
    sharedLoading=true;setSync('error','連線失敗');$('#syncName').textContent='無法登入';toast(error.message||'登入失敗');
  }
})();
</script><script>document.title='研發部專案管理';document.querySelector('.brand-text').textContent='研發部專案管理';</script></body></html>
